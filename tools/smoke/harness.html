<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smoke test — 1-Click MVU (ban Viet hoa)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4f1e8;
        font-family: sans-serif;
      }
    </style>
    <script src="../../node_modules/vue/dist/vue.global.prod.js"></script>
    <script src="../../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="../../node_modules/pinia/dist/pinia.iife.prod.js"></script>
    <script>
      // ---- Bat moi loi de test co the doc lai ----
      window.__errors = [];
      window.addEventListener("error", (e) => window.__errors.push("error: " + (e.message || e)));
      window.addEventListener("unhandledrejection", (e) =>
        window.__errors.push("unhandledrejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason)),
      );

      // ---- Stub cac global cua SillyTavern / Tavern Helper ----
      // The nhan vat "da lam san": co san loi mo dau, regex rieng va script rieng cua nguoi dung.
      const CHARS = [
        {
          name: "Thu Minh Nguyet",
          avatar: "a.png",
          first_messages: ["Trăng lên tới đỉnh đồi, nàng quay lại nhìn bạn.", "Bản chào thay thế."],
          extensions: {
            regex_scripts: [{ id: "u-1", script_name: "Regex riêng của tôi", find_regex: "/x/g", replace_string: "" }],
            tavern_helper: {
              scripts: [{ type: "script", id: "u-2", name: "Script riêng của tôi", content: "// giữ nguyên" }],
              variables: {},
            },
          },
          data: { extensions: {} },
        },
      ];
      // Sach the gioi "da lam san": chua mot muc do nguoi dung tu viet.
      window.__books = {
        "Sách thế giới của Thu Minh Nguyệt": [
          { name: "Ghi chép riêng của tôi", content: "Nội dung tôi tự viết.", enabled: true, extra: {} },
        ],
      };
      window.SillyTavern = {
        characters: CHARS,
        getCharacters: async () => CHARS,
        unshallowCharacter: async () => {},
        selectCharacterById: async () => {},
      };
      window.getCurrentCharacterName = () => "Thu Minh Nguyet";
      window.getCharacterNames = () => CHARS.map((c) => c.name);
      window.getCharacter = () => CHARS[0];
      window.replaceCharacter = async () => {};
      window.updateCharacterWith = async (n, f) => f(CHARS[0]);
      window.createCharacter = async () => CHARS[0];
      window.getWorldbookNames = () => Object.keys(window.__books);
      window.getCharWorldbookNames = () => ({ primary: "Sách thế giới của Thu Minh Nguyệt", additional: [] });
      window.getWorldbook = async (n) => (window.__books[n] || []).map((x) => ({ ...x }));
      window.createWorldbook = async (n, e = []) => ((window.__books[n] = e.slice()), true);
      window.deleteWorldbook = async (n) => (delete window.__books[n], true);
      window.replaceWorldbook = async (n, e) => {
        window.__books[n] = e.slice();
      };
      window.updateWorldbookWith = async (n, f) => {
        const next = f((window.__books[n] || []).map((x) => ({ ...x })));
        return (window.__books[n] = next);
      };
      window.createWorldbookEntries = async (n, e) => {
        window.__books[n] = [...(window.__books[n] || []), ...e];
        return { entries: window.__books[n], new_entries: e };
      };
      window.rebindCharWorldbooks = async () => {};
      window.getScriptTrees = () => [];
      window.replaceScriptTrees = async () => {};
      window.updateScriptTreesWith = async (f) => f([]);
      window.replaceTavernRegexes = async () => {};
      window.updateTavernRegexesWith = async (f) => f([]);
      window.generateRaw = async () => "";
      window.stopGenerationById = () => true;
      window.getScriptId = () => "smoke-test-script";
      window.iframe_events = { STREAM_TOKEN_RECEIVED_FULLY: "stream_token" };
      window.eventOn = () => {};
      window.toastr = {
        success: (m, t) => window.__errors.push("toastr.success: " + t + " / " + m),
        error: (m, t) => window.__errors.push("toastr.error: " + t + " / " + m),
        warning: (m, t) => window.__errors.push("toastr.warning: " + t + " / " + m),
        info: (m, t) => window.__errors.push("toastr.info: " + t + " / " + m),
      };
      // Nut cua script: ghi lai handler de test tu bam
      window.__buttons = [];
      window.replaceScriptButtons = (b) => {
        window.__buttons = b;
      };
      window.getButtonEvent = (name) => "button:" + name;
      const _eventOn = window.eventOn;
      window.__handlers = {};
      window.eventOn = (evt, fn) => {
        window.__handlers[evt] = fn;
      };
    </script>
  </head>
  <body>
    <script type="module" src="./bundle.test.js"></script>
  </body>
</html>
